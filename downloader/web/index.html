<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Bulk Downloader Pro</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>YouTube Bulk Downloader</h1>
          <p>Download 1 to 100+ Videos or Audio in High Quality with yt-dlp</p>
        </div>
      </div>
      <div class="connection-status">
        <span class="status-dot online" id="status-dot"></span>
        <span id="status-text">Connected</span>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main class="main-content">
      
      <!-- Input & Configuration Card -->
      <section class="card config-card">
        
        <!-- URL Input Section -->
        <div class="section-group">
          <div class="section-header">
            <label for="url-input" class="label-title">
              <span>📋 Paste YouTube Links</span>
              <span class="badge" id="link-count-badge">0 Links</span>
            </label>
            <button class="btn-text" id="btn-paste-clipboard">📋 Paste from Clipboard</button>
          </div>
          <textarea id="url-input" rows="6" placeholder="Paste your copied YouTube links here (one link per line)...&#10;https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=..."></textarea>
        </div>

        <!-- Configuration Controls -->
        <div class="config-grid">
          
          <!-- Format Selection -->
          <div class="config-item">
            <label class="label-title">Format Type</label>
            <div class="toggle-group" id="format-toggle">
              <button class="toggle-btn active" data-format="video">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                <span>Video (MP4)</span>
              </button>
              <button class="toggle-btn" data-format="audio">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
                <span>Audio (MP3)</span>
              </button>
            </div>
          </div>

          <!-- Quality Selection -->
          <div class="config-item">
            <label for="quality-select" class="label-title">Quality Preset</label>
            <select id="quality-select" class="custom-select">
              <option value="best">Best Available Quality</option>
              <option value="1080p">1080p Full HD</option>
              <option value="720p">720p HD</option>
              <option value="480p">480p SD</option>
            </select>
          </div>

          <!-- Destination Folder Selection -->
          <div class="config-item folder-select-group">
            <label class="label-title">Destination Folder</label>
            <div class="folder-input-wrapper">
              <input type="text" id="folder-path-input" readonly placeholder="Select download destination folder...">
              <button class="btn btn-secondary" id="btn-browse-folder" title="Browse Folder">
                <span>📁 Browse</span>
              </button>
              <button class="btn btn-secondary" id="btn-open-folder" title="Open in Windows Explorer">
                <span>📂 Open</span>
              </button>
            </div>
          </div>

        </div>

        <!-- Start Download Action -->
        <div class="action-footer">
          <button class="btn btn-primary btn-large" id="btn-start-download">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <span>Start Bulk Download</span>
          </button>
        </div>

      </section>

      <!-- Downloads Queue & Live Progress Card -->
      <section class="card queue-card">
        
        <div class="queue-header">
          <div class="queue-title-group">
            <h2>Download Queue & Status</h2>
            <div class="stats-pills">
              <span class="pill pill-total">Total: <strong id="stat-total">0</strong></span>
              <span class="pill pill-downloading">Downloading: <strong id="stat-active">0</strong></span>
              <span class="pill pill-completed">Completed: <strong id="stat-completed">0</strong></span>
              <span class="pill pill-failed">Failed: <strong id="stat-failed">0</strong></span>
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" id="btn-clear-completed">Clear Finished</button>
        </div>

        <!-- Task List Container -->
        <div class="tasks-container" id="tasks-container">
          <div class="empty-tasks-state">
            <div class="empty-icon">📥</div>
            <h3>No Downloads in Progress</h3>
            <p>Paste your YouTube video links above and click "Start Bulk Download" to begin downloading.</p>
          </div>
        </div>

      </section>

    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
